<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لغز الأستاذة شهد عودة</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 20% 20%,#dff6ff 0 8%,transparent 9%),
    radial-gradient(circle at 80% 15%,#e9e0ff 0 7%,transparent 8%),
    linear-gradient(135deg,#eefaff,#f8f3ff,#ffffff);
  color:#18243a;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.game{
  width:100%;
  max-width:650px;
  background:rgba(255,255,255,.94);
  border-radius:30px;
  padding:25px;
  box-shadow:0 20px 60px rgba(42,75,120,.18);
  border:1px solid rgba(255,255,255,.8);
  position:relative;
  overflow:hidden;
}

.game:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:#dff5ff;
  border-radius:50%;
  top:-90px;
  left:-70px;
}

.game:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  background:#eee5ff;
  border-radius:50%;
  bottom:-80px;
  right:-60px;
}

.header{
  position:relative;
  z-index:2;
  text-align:center;
}

.badge{
  display:inline-block;
  background:#e8f7ff;
  color:#0877b9;
  padding:8px 16px;
  border-radius:50px;
  font-size:14px;
  font-weight:bold;
}

h1{
  margin:12px 0 5px;
  font-size:31px;
  color:#123d67
