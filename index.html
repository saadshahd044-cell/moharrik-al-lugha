<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لغز الأستاذة شهد عودة</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 15%,#dff7ff 0 10%,transparent 25%),
    radial-gradient(circle at 85% 85%,#e4dcff 0 10%,transparent 25%),
    linear-gradient(135deg,#f7fbff,#eef4ff);
  color:#18243a;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.game{
  width:100%;
  max-width:620px;
  background:rgba(255,255,255,.94);
  border-radius:30px;
  padding:24px;
  box-shadow:0 20px 60px rgba(38,71,120,.18);
  border:1px solid #e5edfa;
  text-align:center;
}

.badge{
  display:inline-block;
  background:#e9f5ff;
  color:#1673b8;
  padding:8px 16px;
  border-radius:30px;
  font-size:14px;
  font-weight:bold;
}

h1{
  margin:14px 0 5px;
  font-size:30px;
  color:#1769aa;
}

.subtitle{
  margin:0 0 20px;
  color:#66758c;
}

.cup{
  width:120px;
  height:120px;
  margin:15px auto 22px;
  border-radius:50%;
  background:linear-gradient(145deg,#149bea,#0755b8);
  display:flex;
  align-items:center;
  justify-content:center;
